    <h1>destructing</h1>
    <script>
        const colors=["red","orange","blue"];
        const [first,second,third]=colors;
        console.log(second);
        const numbers =[1,2,3,4,5];
        const [one,,,four,five] =numbers;
        console.log(one);
        console.log(four);

        const student={
            name:"david",
            age:20
        };
        const{name:studentName,age:studentAge}=student;
        console.log(studentName);
        console.log(studentAge);

    </script>
