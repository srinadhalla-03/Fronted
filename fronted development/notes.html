<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes App</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <h2 class="text-center mb-4">📝 Notes Application</h2>

    <!-- Add Note Form -->
    <div class="card p-3 mb-4">
      <div class="mb-3">
        <label for="noteInput" class="form-label">Enter Note</label>
        <textarea id="noteInput" class="form-control" rows="3"></textarea>
      </div>
      <button id="addNoteBtn" class="btn btn-primary">Add Note</button>
    </div>

    <!-- Notes List -->
    <div id="notesContainer" class="row g-3"></div>

    <!-- Display Box -->
    <div class="card mt-4">
      <div class="card-header">Displayed Note</div>
      <div class="card-body">
        <p id="displayBox" class="text-muted">Click "Display" on a note to show it here.</p>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="storage.js"></script>
</body>
</html>
