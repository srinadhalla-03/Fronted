<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basic User List</title>
    <!-- 1. Load Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* 2. Simple Table Borders */
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse; /* Merges double lines */
            padding: 8px;
        }
    </style>
</head>
<body>

    <div class="container mt-4">
        
        <!-- 3. Basic Carousel -->
        <div id="myCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <div class="bg-primary text-white text-center p-5">Slide 1</div>
                </div>
                <div class="carousel-item">
                    <div class="bg-success text-white text-center p-5">Slide 2</div>
                </div>
                <div class="carousel-item">
                    <div class="bg-danger text-white text-center p-5">Slide 3</div>
                </div>
            </div>
            <!-- Controls -->
            <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>

        <h2 class="mt-4">Users</h2>
        
        <!-- 4. Table with List Inside -->
        <table id="user-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Details (List)</th>
                </tr>
            </thead>
            <tbody id="list"></tbody>
        </table>

    </div>

    <!-- 5. Load Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        fetch('https://dummyjson.com/users?limit=5')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('list');
                
                // Create rows with a <ul> inside the last <td>
                const rows = data.users.map(u => `
                    <tr>
                        <td>${u.firstName} ${u.lastName}</td>
                        <td>${u.email}</td>
                        <td>
                            <ul>
                                <li>Age: ${u.age}</li>
                                <li>Phone: ${u.phone}</li>
                            </ul>
                        </td>
                    </tr>
                `).join('');
                
                tbody.innerHTML = rows;
            })
            .catch(() => {
                document.getElementById('list').innerHTML = '<tr><td colspan="3">Error loading data</td></tr>';
            });
    </script>
</body>
</html>
